name: 每日更新数据（BOH · 已停用）

# BOH 站点已下线，定时触发已移除，只保留手动运行。
# 它抓的数据只写 boh-site/public/data/，不影响线上（线上现在是 lp-site）。
# 如需彻底移除，直接删掉这个文件。

on:
  workflow_dispatch:

# 需要写权限才能把抓到的数据提交回仓库
permissions:
  contents: write

# 同一时间只跑一个，避免两次抓取互相覆盖
concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取数据
        working-directory: boh-site/scripts
        run: |
          set -e
          echo "::group::行情与平台数据"
          python fetch_data.py
          echo "::endgroup::"

          echo "::group::行情带八币"
          python fetch_market.py
          echo "::endgroup::"

          echo "::group::BTC 全历史周线"
          python fetch_cycle.py
          echo "::endgroup::"

          echo "::group::平台币全历史"
          python fetch_platform_history.py
          echo "::endgroup::"

          # 回测依赖上面的日线数据，必须放在之后
          echo "::group::自平衡回测"
          python backtest_rebalance.py
          echo "::endgroup::"

      - name: 检查是否有变化
        id: diff
        working-directory: boh-site/public/data
        run: |
          if git diff --quiet -- .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "变化概览："
            git diff --stat -- .
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "BOH Bot"
          git config user.email "boh-bot@users.noreply.github.com"
          git add boh-site/public/data
          git commit -m "每日数据更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: 输出摘要
        run: |
          {
            echo "### 数据更新结果"
            echo ""
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo "有更新，已提交并触发重新部署。"
            else
              echo "无变化（行情与上次一致）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
