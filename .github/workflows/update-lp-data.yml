name: LP 看板监控

# 抓取 → 异动检测 → 推送（Telegram / 邮件）
# 推送渠道没配就静默跳过，不影响数据更新。

on:
  schedule:
    # 每小时一次（UTC 整点后 5 分，避开整点的 Actions 高峰）
    # 注：公开仓库的 Actions 免费不限量
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      notify_test:
        description: '只发一条测试通知（验证 Telegram / 邮件配置）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lp-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- 只发测试消息的分支 ----
      - name: 发送测试通知
        if: inputs.notify_test == true
        working-directory: lp-site/scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py --test

      # ---- 正常流程：抓取 → 检测 → 推送 ----
      - name: 抓取 LP 池数据
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        env:
          FETCH_BUDGET_S: '1500'
        run: python fetch_pools.py

      # 收益率必须来自 DefiLlama 官方口径。如果这一轮基本都没匹配上，
      # 说明数据源挂了或匹配逻辑坏了——宁可让这轮失败，也不要把
      # 一堆「官方未收录」推上线上（那等于整个看板没有收益数据）。
      - name: 校验官方收益率覆盖率
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        run: python check_yield_coverage.py

      - name: 异动检测
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        run: python detect.py

      - name: 推送异动
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://chasebig.xyz
        run: python notify.py

      - name: 检查是否有变化
        id: diff
        if: inputs.notify_test != true
        run: |
          if git diff --quiet -- lp-site/public/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- lp-site/public/data/
          fi

      - name: 提交并推送
        if: inputs.notify_test != true && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "LP Bot"
          git config user.email "lp-bot@users.noreply.github.com"
          git add lp-site/public/data/
          git commit -m "LP 数据更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: 输出摘要
        if: inputs.notify_test != true
        run: |
          {
            echo "### LP 看板监控"
            echo ""
            if [ -f lp-site/public/data/alerts.json ]; then
              N=$(python -c "import json;print(json.load(open('lp-site/public/data/alerts.json')).get('n',0))")
              echo "本轮异动：**${N}** 条"
            fi
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo "数据有更新，已提交。"
            else
              echo "数据无变化。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
