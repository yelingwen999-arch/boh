name: LP 看板监控

# 抓取 → 异动检测 → 推送（Telegram / 邮件）
# 推送渠道没配就静默跳过，不影响数据更新。

on:
  schedule:
    # 每 6 小时一次（UTC 每 6 小时的 :05）。
    # 原来每小时一次：完整抓取要 40 分钟，一小时一轮意味着几乎连轴转，
    # 而且一旦某轮被打断（限流/预算），下一轮还会用新的残缺结果继续覆盖，
    # 好数据没有喘息和回滚的机会。放宽到 6 小时，配合防退化校验，
    # 数据新鲜度对 LP 看板完全够用。
    - cron: '5 */6 * * *'
  workflow_dispatch:
    inputs:
      notify_test:
        description: '只发一条测试通知（验证 Telegram / 邮件配置）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lp-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 完整抓取本地实测要 40 分钟以上（72 个池、4 条链、每池还要补小时线）。
    # 原来给 35 分钟不够，配合下面的 FETCH_BUDGET_S=1500 会稳定停在半路，
    # 把抓了一半的数据当成完整结果提交，线上池子数从 72 掉到过 21。
    timeout-minutes: 55

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- 只发测试消息的分支 ----
      - name: 发送测试通知
        if: inputs.notify_test == true
        working-directory: lp-site/scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py --test

      # ---- 正常流程：抓取 → 校验 → 检测 → 推送 ----
      - name: 抓取 LP 池数据
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        env:
          # 2400s（40 分钟）是本地实测完整抓取所需。给少了脚本会按设计
          # 在预算耗尽时停下并写出「扫到的那部分」，看起来是一次成功的
          # 抓取，实际是残缺数据。宁可跑久一点，也不要半份数据。
          FETCH_BUDGET_S: '2400'
        run: python fetch_pools.py

      # 池子数防退化：这一版比上一版少太多，说明抓取没跑完（预算/限流），
      # 直接让这轮失败，保留上一版。必须先于覆盖率检查跑——
      # 覆盖率看的是比例，21 个池里 14 个有 APY 依然能通过。
      - name: 校验池子数没有异常缩水
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        run: python check_pool_regression.py

      # 收益率必须来自 DefiLlama 官方口径。如果这一轮基本都没匹配上，
      # 说明数据源挂了或匹配逻辑坏了——宁可让这轮失败，也不要把
      # 一堆「官方未收录」推上线上（那等于整个看板没有收益数据）。
      - name: 校验官方收益率覆盖率
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        run: python check_yield_coverage.py

      - name: 异动检测
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        run: python detect.py

      - name: 推送异动
        if: inputs.notify_test != true
        working-directory: lp-site/scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://chasebig.xyz
        run: python notify.py

      - name: 检查是否有变化
        id: diff
        if: inputs.notify_test != true
        run: |
          if git diff --quiet -- lp-site/public/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- lp-site/public/data/
          fi

      - name: 提交并推送
        if: inputs.notify_test != true && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "LP Bot"
          git config user.email "lp-bot@users.noreply.github.com"
          git add lp-site/public/data/
          git commit -m "LP 数据更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: 输出摘要
        if: inputs.notify_test != true
        run: |
          {
            echo "### LP 看板监控"
            echo ""
            if [ -f lp-site/public/data/alerts.json ]; then
              N=$(python -c "import json;print(json.load(open('lp-site/public/data/alerts.json')).get('n',0))")
              echo "本轮异动：**${N}** 条"
            fi
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo "数据有更新，已提交。"
            else
              echo "数据无变化。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
